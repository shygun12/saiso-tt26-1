services:
  - type: web
    name: bao-cao-cong-viec-online
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bcddbt-db
          property: connectionString
databases:
  - name: bcddbt-db
    plan: free
    databaseName: bcddbt
    user: bcddbt
    postgresMajorVersion: "17"